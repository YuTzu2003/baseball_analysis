[project]
name = "baseball-analysis"
version = "0.1.0"
description = "CPBL baseball analytics API"
readme = "README.md"
authors = [
    { name = "YuTzu2003", email = "chia0230999@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
baseball-analysis = "baseball_analysis:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
